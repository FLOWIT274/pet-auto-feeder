[package]
name = "webd"
version = "0.1.0"
edition = "2021"
description = "LicheeRV Nano 后台管理系统：Axum 单进程 Web 管理服务（系统/视觉/插座/推送/日志）"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt", "net", "time", "io-util", "sync", "fs", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
libc = "0.2"
tokio-stream = "0.1"
jpeg-encoder = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"