# /etc/buzzer.conf — 蜂鸣器节奏配置
#
# 生效方式：buzzer_beep.sh 每次运行时读取本文件 → **改完立即生效，无需重启**。
# 优先级：命令行参数(仅次数) > 显式环境变量 > 本文件 > 脚本内置默认值。
#
# 试听方法（改完直接跑，不必等配额刷新）：
#     /usr/bin/buzzer_beep.sh          # 按本文件的 BUZZ_COUNT/ON/GAP 响
#     /usr/bin/buzzer_beep.sh 5        # 临时响 5 下（次数覆盖本文件）
#     BUZZ_ON=0.5 /usr/bin/buzzer_beep.sh 2   # 临时改单次时长

# 响几下（配额刷新提醒用）
BUZZ_COUNT=2

# 每下持续时间，秒，支持小数（0.15 ≈ 短促"嘀"；1.0 ≈ 长鸣）
BUZZ_ON=0.15

# 两下之间的间隔，秒
BUZZ_GAP=0.25

# 触发极性：1 = 高电平触发（高响、低静音）；0 = 低电平触发（低响、高静音）
# 本板实测为高电平触发（接上模块后低电平安静、高电平响），保持 1。
ACTIVE_HIGH=1

# 响完是否把 A19 还原成原厂复用 UART1_RTS：1 = 还原；0 = 保持 GPIO 输出低。
# 建议保持 0：UART1_RTS 在该 UART 复位态下会把引脚驱高，高触发模块会持续长响。
RESTORE_MUX=0
